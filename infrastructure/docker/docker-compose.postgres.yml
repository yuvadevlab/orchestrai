# ============================================================================
# Docker Compose: PostgreSQL 16 (with pgvector) & Redis 7 for OrchestrAI
# ============================================================================

version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orchestrai-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orchestrai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Yuva1213}
      POSTGRES_DB: ${POSTGRES_DB:-orchestrai_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init/00_run_all.sh:/docker-entrypoint-initdb.d/00_run_all.sh:ro
      - ../postgres/init:/docker-entrypoint-initdb.d/init:ro
      - ../postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-orchestrai} -d ${POSTGRES_DB:-orchestrai_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orchestrai-net

  redis:
    image: redis:7-alpine
    container_name: orchestrai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - orchestrai-net

volumes:
  postgres_data:
    name: orchestrai_postgres_data
  redis_data:
    name: orchestrai_redis_data

networks:
  orchestrai-net:
    name: orchestrai-network
    driver: bridge
