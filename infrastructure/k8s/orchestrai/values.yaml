replicaCount: 2

image:
  repository: orchestrai/app
  pullPolicy: IfNotPresent
  tag: "latest"

gateway:
  port: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

realtime:
  port: 8001
  resources:
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  concurrency: 10
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi

ingress:
  enabled: true
  host: orchestrai.local
