global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "orchestrai-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "gateway"

  - job_name: "orchestrai-realtime"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: "realtime"

  - job_name: "orchestrai-worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: "worker"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"
