name: 🛡️ CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🧹 ESLint & Ruff Code Check
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup-node-env
        with:
          setup-python: "true"

      - name: 🧹 Execute Lint Checks
        run: pnpm lint

  format:
    name: 🎨 Prettier & Ruff Formatting
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup-node-env
        with:
          setup-python: "true"

      - name: 🎨 Verify Formatting
        run: pnpm format:check

  typecheck:
    name: 🔎 TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup-node-env

      - name: 🔎 Execute Type Check
        run: pnpm typecheck

  build:
    name: 🏗️ Turbo Monorepo Build
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup-node-env

      - name: 🏗️ Execute Monorepo Build
        run: pnpm build

  commitlint:
    name: 📝 Validate PR Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Environment
        uses: ./.github/actions/setup-node-env

      - name: 📝 Validate Commits with Commitlint
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
