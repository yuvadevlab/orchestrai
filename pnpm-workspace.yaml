packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.1"
  - "@turbo/darwin-arm64@2.11.1"
  - "@turbo/linux-64@2.11.1"
  - "@turbo/linux-arm64@2.11.1"
  - "@turbo/windows-64@2.11.1"
  - "@turbo/windows-arm64@2.11.1"
  - prettier@3.9.8
  - turbo@2.11.1
  - "@yuva-devlab/tokens@1.0.0 || 1.1.0 || 1.1.1"
  - "@yuva-devlab/ui@1.0.1 || 1.1.0 || 1.2.0 || 1.3.0 || 1.3.1"
  - "@yuva-devlab/logger@1.1.0"
overrides:
  "@yuva-devlab/agent-core": link:../devlab-shared/packages/agent-core
  "@yuva-devlab/ai-client": link:../devlab-shared/packages/ai-client
  "@yuva-devlab/auth-react": link:../devlab-shared/packages/auth-react
  "@yuva-devlab/auth-server": link:../devlab-shared/packages/auth-server
  "@yuva-devlab/billing": link:../devlab-shared/packages/billing
  "@yuva-devlab/events": link:../devlab-shared/packages/events
  "@yuva-devlab/rag": link:../devlab-shared/packages/rag
  "@yuva-devlab/resilience": link:../devlab-shared/packages/resilience
  "@yuva-devlab/sdk": link:../devlab-shared/packages/sdk
  "@yuva-devlab/semantic-cache": link:../devlab-shared/packages/semantic-cache
  rollup-plugin-dts: "^6.5.1"
