packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.1"
  - "@turbo/darwin-arm64@2.11.1"
  - "@turbo/linux-64@2.11.1"
  - "@turbo/linux-arm64@2.11.1"
  - "@turbo/windows-64@2.11.1"
  - "@turbo/windows-arm64@2.11.1"
  - prettier@3.9.8
  - turbo@2.11.1
  - "@yuva-devlab/tokens@1.0.0"
  - "@yuva-devlab/ui@1.0.1"
  - "@yuva-devlab/ui@1.1.0"
  - "@yuva-devlab/logger@1.1.0"
overrides:
  rollup-plugin-dts: "^6.5.1"
  # Redirect @yuva-devlab/ui to the local devlab-shared source so theme and
  # component changes take effect immediately without a publish cycle.
  # This link: protocol is pnpm-native — no symlink management needed manually.
  "@yuva-devlab/ui": "link:../devlab-shared/packages/ui"
