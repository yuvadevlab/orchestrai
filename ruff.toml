# Monorepo root configuration for Ruff Python linter and formatter
target-version = "py311"
line-length = 88

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "PIE",    # flake8-pie
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "S104",   # possible binding to all interfaces (standard 0.0.0.0 in microservices)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
